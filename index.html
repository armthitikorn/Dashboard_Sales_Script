<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard เสียงตอบ Sales E-Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; padding: 20px; background: #f4f7f6; margin: 0; }
        .wrap { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 26px; color: #d9534f; margin: 10px 0 16px; }
        .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; min-width: 200px; padding: 11px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; font-family: inherit; }
        button { padding: 11px 18px; font-size: 16px; font-family: inherit; font-weight: bold; color: #fff; background: #5cb85c; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #4cae4c; }
        .count { color: #666; font-size: 14px; margin-bottom: 10px; }
        details { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.07); margin-bottom: 10px; padding: 0 16px; }
        summary { cursor: pointer; padding: 14px 0; list-style: none; }
        summary b { font-size: 17px; }
        .meta { color: #777; font-size: 14px; margin-top: 3px; }
        .item { border-top: 1px solid #eee; padding: 12px 0; }
        .item .q { font-size: 14px; color: #444; margin-bottom: 6px; }
        .item .p { font-size: 13px; color: #337ab7; font-weight: bold; }
        audio { width: 100%; }
        .msg { text-align: center; color: #888; padding: 30px 0; }
        .err { color: #d9534f; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>🎧 เสียงตอบข้อโต้แย้ง</h1>
    <div class="bar">
        <input type="text" id="search" placeholder="ค้นหาชื่อหรือสังกัด">
        <button id="reloadBtn">รีเฟรช</button>
    </div>
    <div class="count" id="count"></div>
    <div id="list"><div class="msg">กำลังโหลด...</div></div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // ดึงเฉพาะตารางและ bucket ของแอปเอเจนนี้เท่านั้น
    const TABLE  = 'agent_recordings';
    const BUCKET = 'agent-recordings';

    const $ = id => document.getElementById(id);
    const el = (tag, text, cls) => {
        const e = document.createElement(tag);
        if (text !== undefined) e.textContent = text;
        if (cls) e.className = cls;
        return e;
    };
    const fmt = d => new Date(d).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
    const DIFF = { easy: 'ปกติ (Easy)', hard: 'ท้าทาย (Hard)' };

    let sessions = [];

    const load = async () => {
        $('list').innerHTML = '<div class="msg">กำลังโหลด...</div>';
        $('count').textContent = '';
        const { data, error } = await supabase.from(TABLE).select('*')
            .order('created_at', { ascending: false }).limit(1000);
        if (error) {
            $('list').innerHTML = '';
            $('list').append(el('div', 'โหลดข้อมูลไม่สำเร็จ: ' + error.message, 'msg err'));
            return;
        }
        const map = new Map();
        data.forEach(r => {
            if (!map.has(r.session_id)) {
                map.set(r.session_id, { id: r.session_id, name: r.trainee_name, group: r.trainee_group,
                    difficulty: r.difficulty, at: r.created_at, rows: [] });
            }
            map.get(r.session_id).rows.push(r);
        });
        sessions = [...map.values()];
        sessions.forEach(s => s.rows.sort((a, b) => a.part - b.part || a.q_num - b.q_num));
        render();
    };

    const fillAudio = (box, s) => {
        s.rows.forEach(r => {
            const item = el('div', undefined, 'item');
            item.append(el('div', 'Step ' + r.part + ' ข้อ ' + r.q_num, 'p'));
            item.append(el('div', r.q_text || '', 'q'));
            if (r.audio_path) {
                const a = document.createElement('audio');
                a.controls = true;
                a.preload = 'none';
                a.src = supabase.storage.from(BUCKET).getPublicUrl(r.audio_path).data.publicUrl;
                item.append(a);
            } else {
                item.append(el('div', 'ไม่มีไฟล์เสียง', 'msg'));
            }
            box.append(item);
        });
    };

    const render = () => {
        const kw = $('search').value.trim().toLowerCase();
        const shown = sessions.filter(s => !kw ||
            (s.name || '').toLowerCase().includes(kw) || (s.group || '').toLowerCase().includes(kw));
        $('count').textContent = 'แสดง ' + shown.length + ' ชุดการทดสอบ จากทั้งหมด ' + sessions.length;
        $('list').innerHTML = '';
        if (!shown.length) { $('list').append(el('div', 'ไม่พบข้อมูล', 'msg')); return; }
        shown.forEach(s => {
            const d = document.createElement('details');
            const sum = document.createElement('summary');
            sum.append(el('b', s.name));
            sum.append(el('div', (s.group || '-') + ' • ' + (DIFF[s.difficulty] || s.difficulty || '-') +
                ' • ' + s.rows.length + ' ข้อ • ' + fmt(s.at), 'meta'));
            d.append(sum);
            const box = document.createElement('div');
            d.append(box);
            // สร้างเครื่องเล่นเสียงตอนเปิดดูเท่านั้น เพื่อไม่โหลดไฟล์เสียงทั้งหมดพร้อมกัน
            d.addEventListener('toggle', () => { if (d.open && !box.childElementCount) fillAudio(box, s); });
            $('list').append(d);
        });
    };

    $('search').oninput = render;
    $('reloadBtn').onclick = load;
    load();
</script>
</body>
</html>
